services:
  # Ignition Gateway Service
  ignition:
    image: bwdesigngroup/ignition-docker:8.1.44
    platform: linux/amd64
    environment:
      GATEWAY_MODULES_ENABLED: perspective,web-developer
      DEVELOPER_MODE: "Y"
    volumes:
      - ./ignition-data:/workdir
      - ./backups/gateway.gwbk:/restore.gwbk
      # Test fixtures, one mount per lint domain, so packages/views authored in the Designer
      # land in the repo (Perspective views as folder TestCases, library scripts as package TestCases)
      - ../tests/cases/views:/workdir/projects/Testing/com.inductiveautomation.perspective/views/TestCases
      - ../tests/cases/scripting:/workdir/projects/Testing/ignition/script-python/TestCases
    labels:
      traefik.enable: "true"
      traefik.hostname: "ignition-lint"
      dev.orbstack.http-port: "8088"
    command: >
      -n ignition-lint-gateway
      -r /restore.gwbk

    networks:
      - default
      - proxy

networks:
  default:
  proxy:
    external: true
    name: proxy
