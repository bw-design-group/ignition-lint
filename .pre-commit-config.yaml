repos:
  # ============================================================================
  # PRE-COMMIT HOOKS (Fast checks on every commit - should complete in seconds)
  # ============================================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        types: [python]
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=5000']  # Allow up to 5MB (for test case files like BadContextData)
        stages: [pre-commit]

  - repo: local
    hooks:
      # Quick pylint on changed files only
      - id: pylint-quick
        name: pylint (changed files only)
        # Run inside the poetry env so `ignition_lint` resolves to src/, not to a
        # previously installed release (a system pylint reports no-name-in-module
        # for every API added since that release).
        entry: poetry run pylint
        language: system
        types: [python]
        # Fixture scripts under tests/cases are Ignition (Jython 2.7) modules with
        # intentional violations; they are linted by ignition-lint's own rules, not this hook.
        exclude: ^tests/cases/
        args: [
          "--rcfile=.config/.pylintrc",
          "--msg-template=\"{path}({line}): [{obj}] {msg} ({symbol})\"",
        ]
        stages: [pre-commit]

      # - id: markdownlint
      #   name: markdownlint
      #   entry: markdownlint
      #   language: system
      #   types: [markdown]
      #   args: [
      #     "--config=.config/.markdownlint.json",
      #     "--ignore-path=.config/.markdownlintignore"
      #   ]
      #   stages: [commit]

  # ============================================================================
  # PRE-PUSH HOOKS (Comprehensive checks before push - can take minutes)
  # ============================================================================

  - repo: local
    hooks:
      # Full pylint on entire codebase
      - id: pylint-full
        name: pylint (full codebase)
        entry: bash -c 'pylint src/ tests/ scripts/ --rcfile=.config/.pylintrc'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Full test suite
      - id: run-all-tests
        name: Run full test suite
        entry: bash -c 'cd tests && python test_runner.py --run-all'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
